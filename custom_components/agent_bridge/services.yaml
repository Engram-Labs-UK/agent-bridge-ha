send_message:
  name: Send Message
  description: Send a message to a bridge agent and receive a response.
  fields:
    message:
      name: Message
      description: The message text to send.
      required: true
      example: "What's the weather like?"
      selector:
        text:
    agent_id:
      name: Agent ID
      description: The agent to send the message to. Defaults to the configured default agent.
      required: false
      example: "cora"
      selector:
        text:
    session_id:
      name: Session ID
      description: Optional session ID for multi-turn context.
      required: false
      selector:
        text:

invoke_tool:
  name: Invoke Tool
  description: Invoke a tool on a specific bridge agent.
  fields:
    agent_id:
      name: Agent ID
      description: The agent to invoke the tool on.
      required: true
      example: "cora"
      selector:
        text:
    tool_name:
      name: Tool Name
      description: The name of the tool to invoke.
      required: true
      example: "web_search"
      selector:
        text:
    args:
      name: Arguments
      description: Optional arguments for the tool.
      required: false
      selector:
        object:

broadcast:
  name: Broadcast
  description: Send a message to all bridge agents, or a tagged subset.
  fields:
    message:
      name: Message
      description: The message text to broadcast.
      required: true
      example: "System maintenance starting in 5 minutes."
      selector:
        text:
    tags:
      name: Tags
      description: Optional list of tags to filter which agents receive the message.
      required: false
      selector:
        object:

ask_with_image:
  name: Ask with image
  description: Capture a camera snapshot and ask a bridge agent about it (vision).
  fields:
    message:
      name: Message
      description: The question or instruction to send with the image.
      required: true
      example: "Who is at the front door?"
      selector:
        text:
    camera_entity_id:
      name: Camera
      description: The camera to snapshot.
      required: true
      example: "camera.front_door"
      selector:
        entity:
          domain: camera
    agent_id:
      name: Agent ID
      description: Optional agent to ask (defaults to the bridge's routing).
      required: false
      example: "cora"
      selector:
        text:
    session_id:
      name: Session ID
      description: Optional bridge channel/session id for continuity.
      required: false
      selector:
        text:

announce:
  name: Announce
  description: Proactively speak a message on a satellite (skips unavailable ones unless critical).
  fields:
    message:
      name: Message
      description: The message to speak.
      required: true
      example: "The washing machine has finished."
      selector:
        text:
    target:
      name: Satellite
      description: The assist_satellite entity to announce on.
      required: true
      example: "assist_satellite.kitchen"
      selector:
        entity:
          domain: assist_satellite
    priority:
      name: Priority
      description: low/normal skip an unavailable satellite; critical always attempts.
      required: false
      default: normal
      selector:
        select:
          options:
            - low
            - normal
            - critical

memory_record:
  name: Record memory
  description: Store a memory item for a bridge agent so it persists across conversations.
  fields:
    content:
      name: Content
      description: The fact or note to remember.
      required: true
      example: "The back door sticks in wet weather."
      selector:
        text:
          multiline: true
    agent_id:
      name: Agent ID
      description: The agent to store the memory for. Defaults to the configured default agent.
      required: false
      example: "cora"
      selector:
        text:
    tags:
      name: Tags
      description: Optional list of tags to file the memory under.
      required: false
      selector:
        object:

memory_recall:
  name: Recall memory
  description: Retrieve an agent's stored memory items, optionally filtered by a query.
  fields:
    query:
      name: Query
      description: Optional search text to narrow the recall.
      required: false
      example: "back door"
      selector:
        text:
    agent_id:
      name: Agent ID
      description: The agent to recall from. Defaults to the configured default agent.
      required: false
      example: "cora"
      selector:
        text:
