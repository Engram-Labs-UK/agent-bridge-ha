[project]
name = "agent-bridge-ha"
version = "0.2.0"
# Modern HA conversation APIs (ConversationEntity._async_handle_message, ChatLog,
# config subentries) require Python 3.13 / HA >= 2025.2; tested on HA 2026.2.3
# (see const.TESTED_HA_VERSION, US0029).
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
