name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ruff

      - name: Ruff lint
        run: ruff check custom_components/

      - name: Ruff format check
        run: ruff format --check custom_components/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest pytest-asyncio pytest-cov aiohttp voluptuous homeassistant hassil home-assistant-intents

      - name: Run tests
        run: python -m pytest tests/ -v --cov=custom_components/agent_bridge --cov-report=term-missing --cov-fail-under=80
