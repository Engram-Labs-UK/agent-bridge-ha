name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# US0029/AC3: CI runs the suite against a pinned, current HA core so the
# integration cannot silently re-drift against bridge/HA the way it drifted
# v3.1 -> v4.36. Keep HA_VERSION in step with const.TESTED_HA_VERSION.
env:
  HA_VERSION: "2026.2.3"
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install ruff

      - name: Ruff lint
        run: ruff check custom_components/

      - name: Ruff format check
        run: ruff format --check custom_components/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install camera native dependency
        # EP0008: the vision (camera) + AI Task tests import
        # homeassistant.components.camera, whose PyTurboJPEG requirement loads
        # the libturbojpeg shared library via ctypes at import time.
        run: sudo apt-get update && sudo apt-get install -y libturbojpeg0

      - name: Install dependencies (pinned HA core)
        run: |
          pip install "homeassistant==${HA_VERSION}" \
            pytest pytest-asyncio pytest-homeassistant-custom-component
          # Component requirements are loaded by HA at runtime, not pip-installed
          # by the homeassistant package. The tests import these components, so
          # install their requirements explicitly:
          #   conversation -> hassil, home-assistant-intents
          #   camera / ai_task (EP0008 vision + AI Task) -> PyTurboJPEG
          pip install hassil home-assistant-intents "PyTurboJPEG==1.7.5"

      - name: Run tests
        run: python -m pytest tests/ -q
